[package]
name = "ps-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "1537paperstreet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ps-core = { version = "0.1.0", path = "../ps-core" }
ps-render = { version = "0.1.0", path = "../ps-render" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]
tempfile = "3.27.0"
