name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo fmt --all --check
      - run: npm run format:check

  clippy:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-clippy-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run lint

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo test --workspace
      - run: npm run test

  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo build --workspace --release

  coverage:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --lcov --output-path coverage/rust/lcov.info
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/

  security:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-security-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-security-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo install cargo-deny --locked
      - run: cargo install cargo-audit --locked
      - run: cargo deny check
      - run: cargo audit
      - run: npm audit --audit-level=high
